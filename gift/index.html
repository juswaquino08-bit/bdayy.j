<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>A Little Birthday Surprise 💙</title>
<style>
*{box-sizing:border-box}
body{
  margin:0; min-height:100vh; overflow-x:hidden;
  font-family:Georgia,serif; color:#17345f;
  background:
    radial-gradient(circle at 20% 15%,rgba(255,255,255,.65),transparent 28%),
    radial-gradient(circle at 80% 80%,rgba(126,165,211,.20),transparent 30%),
    linear-gradient(135deg,#07172f,#102e55 48%,#07172f);
}
body:before{
  content:""; position:fixed; inset:0; pointer-events:none; opacity:.16;
  background-image:radial-gradient(rgba(255,255,255,.8) .7px,transparent .7px);
  background-size:5px 5px;
}
.screen{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
.hidden{display:none!important}

/* opening */
.opening{
  text-align:center;position:relative;width:min(900px,100%);
  padding:55px 25px 40px;
  border:1px solid rgba(255,255,255,.25);
  border-radius:34px;
  background:rgba(255,255,255,.07);
  box-shadow:0 30px 80px rgba(0,0,0,.38),inset 0 1px rgba(255,255,255,.18);
  backdrop-filter:blur(10px);
}
.cat{
  position:absolute;width:170px;height:170px;object-fit:cover;
  border-radius:24px;border:7px solid rgba(255,255,255,.92);
  box-shadow:0 18px 35px rgba(0,0,0,.38),0 0 0 1px rgba(255,255,255,.3);
  animation:bob 2.5s ease-in-out infinite;
}
.cat.left{left:2%;bottom:18%}
.cat.right{right:2%;bottom:18%;animation-delay:.7s}
@keyframes bob{50%{transform:translateY(-12px) rotate(2deg)}}
.stars{font-size:24px;letter-spacing:16px;margin-bottom:8px}
.title{
  font-size:clamp(38px,9vw,78px);font-weight:bold;letter-spacing:4px;
  color:#f7fbff;text-shadow:0 4px 20px rgba(0,0,0,.45),3px 4px 0 #7fa5d1;
  margin:0 0 28px;
}
.subtitle{font-family:Arial,sans-serif;color:#56718f;margin-bottom:22px}
.envelope{
  width:280px;height:180px;margin:auto;position:relative;cursor:pointer;
  background:linear-gradient(145deg,#fffdf7,#e8dcc5);
  border:2px solid #bda982;border-radius:8px;
  box-shadow:0 25px 45px rgba(0,0,0,.42),inset 0 1px rgba(255,255,255,.8);
  transition:.3s;
}
.envelope:hover{transform:translateY(-8px) scale(1.02)}
.envelope:before{
  content:"";position:absolute;inset:0;
  background:linear-gradient(32deg,transparent 49%,#bcd2ed 50%,transparent 51%),
             linear-gradient(-32deg,transparent 49%,#bcd2ed 50%,transparent 51%);
  border-radius:8px;
}
.flap{
  position:absolute;z-index:2;top:0;left:0;width:280px;height:105px;
  background:linear-gradient(145deg,#f5e9cf,#d8c29a);
  clip-path:polygon(0 0,100% 0,50% 100%);
  border-top-left-radius:8px;border-top-right-radius:8px;
  transition:.7s;filter:drop-shadow(0 3px 3px rgba(0,0,0,.18));
}
.envelope.open .flap{transform:rotateX(180deg);transform-origin:top}
.bottomBirthday{margin-top:22px;font-size:26px;font-weight:bold;letter-spacing:2px;color:#244f88;text-shadow:2px 3px #b9d3f2}
.openBtn{
  margin-top:24px;border:1px solid rgba(255,255,255,.35);border-radius:30px;
  padding:14px 34px;background:linear-gradient(135deg,#315f99,#173b70);
  color:white;font-weight:bold;font-size:17px;cursor:pointer;
  box-shadow:0 10px 25px rgba(0,0,0,.3),inset 0 1px rgba(255,255,255,.25);
  transition:.25s;
}
.openBtn:hover{transform:translateY(-3px);box-shadow:0 14px 30px rgba(0,0,0,.38)}

/* menu */
.menu{
  width:min(760px,100%);text-align:center;padding:38px;
  border-radius:30px;background:rgba(248,252,255,.94);
  box-shadow:0 30px 70px rgba(0,0,0,.42);
}
.menu h2{font-size:36px;margin:0 0 8px}
.menu p{font-family:Arial,sans-serif;color:#607895}
.buttons{display:grid;grid-template-columns:repeat(2,1fr);gap:15px;margin-top:25px}
.cardBtn{
  padding:20px;border:1px solid #c4d5e8;
  background:linear-gradient(145deg,#ffffff,#edf4fb);border-radius:18px;
  color:#244f88;font-size:18px;font-weight:bold;cursor:pointer;
  box-shadow:0 10px 20px rgba(43,76,110,.14),inset 0 1px white;
  transition:.25s;
}
.cardBtn:hover{transform:translateY(-4px);background:#f2f8ff}
.panel{
  margin-top:20px;background:linear-gradient(145deg,#fffdf9,#f4efe5);
  border:1px solid #ddd2bd;border-radius:22px;padding:22px;
  box-shadow:0 20px 40px rgba(49,66,86,.22),inset 0 1px white;
  animation:pop .45s ease;
}
@keyframes pop{from{opacity:0;transform:scale(.95)}to{opacity:1;transform:scale(1)}}
.photo{width:min(100%,430px);max-height:520px;object-fit:cover;border-radius:20px;display:block;margin:auto}
.message{font-family:Arial,sans-serif;line-height:1.7;font-size:17px}
.close{margin-top:15px;border:0;border-radius:22px;padding:9px 20px;background:#244f88;color:#fff;cursor:pointer}

/* final */
.final{
  text-align:center;padding:60px 35px;border-radius:35px;
  background:rgba(255,255,255,.09);border:1px solid rgba(255,255,255,.22);
  box-shadow:0 30px 80px rgba(0,0,0,.4);backdrop-filter:blur(10px);
}
.final h1{font-size:clamp(45px,11vw,90px);margin:15px 0;color:#244f88;text-shadow:3px 4px #b9d3f2}
.final .cake{font-size:90px;animation:bob 1.8s ease-in-out infinite}
.confetti{position:fixed;top:-20px;font-size:24px;animation:fall 4s linear infinite}
@keyframes fall{to{transform:translateY(110vh) rotate(500deg)}}
@media(max-width:600px){
 .cat{width:105px;height:105px}.cat.left{left:-2%;bottom:12%}.cat.right{right:-2%;bottom:12%}
 .buttons{grid-template-columns:1fr}.envelope{width:250px}.flap{width:250px}
}
</style>
</head>
<body>

<div id="opening" class="screen">
  <div class="opening">
    <img class="cat left" src="birthday-cat.jpg" alt="Cute birthday cat">
    <img class="cat right" src="birthday-cat.jpg" alt="Cute birthday cat">
    <div class="stars">✦ ✧ ✦</div>
    <h1 class="title">HAPPY<br>BIRTHDAY!</h1>
    <p class="subtitle">A little surprise made just for you ate jea 💙</p>
    <div id="envelope" class="envelope" onclick="openMail()">
      <div class="flap"></div>
    </div>
    <button class="openBtn" onclick="openMail()">OPEN ME 💌</button>
    <div class="bottomBirthday">🎂 HAPPY BIRTHDAY! 🎂</div>
  </div>
</div>

<div id="menu" class="screen hidden">
  <div class="menu">
    <div class="stars">🐾 ✦ 🐾 ✧ 🐾</div>
    <h2>For You 💌</h2>
    <p>Pick anything you want to open ✨</p>

    <div class="buttons">
      <button class="cardBtn" onclick="showSong()">🎵 Song for You</button>
      <button class="cardBtn" onclick="showMessage()">💌 Birthday Message</button>
      <button class="cardBtn" onclick="showSurprise()">🎁 Surprise</button>
      <button class="cardBtn" onclick="showFinal()">🎂 Birthday</button>
    </div>

    <div id="panel" class="panel hidden"></div>
  </div>
</div>

<div id="final" class="screen hidden">
  <div class="final">
    <div class="cake">🎂</div>
    <h1>HAPPY<br>BIRTHDAY! 🎉</h1>
    <p>Hope you have a beautiful day and an amazing year ahead. 💙</p>
    <div style="font-size:45px;margin-top:20px">🐱 ✨ 🎈 ✨ 🐱</div>
  </div>
</div>

<script>
function openMail(){
  const env=document.getElementById("envelope");
  env.classList.add("open");
  setTimeout(()=>{
    document.getElementById("opening").classList.add("hidden");
    document.getElementById("menu").classList.remove("hidden");
  },650);
}
const panel=document.getElementById("panel");
function showPhoto(){
 panel.classList.remove("hidden");
 panel.innerHTML=`
   <h3>📸 A little photo for you</h3>
   <img class="photo" src="her-photo.jpg" alt="Birthday photo">
   <button class="close" onclick="closePanel()">Close</button>`;
}
function showSong(){
 panel.classList.remove("hidden");
 panel.innerHTML=`
   <div class="message">
     <h3>🎵 A Song for You</h3>
     <p>I picked this song because I thought you might like it. 💙</p>
     <audio controls style="width:100%;margin-top:12px;">
       <source src="song.mp3" type="audio/mpeg">
       Your browser does not support audio.
     </audio>
     <p style="font-size:13px;color:#70839a;margin-top:10px;">
       
     </p>
   </div>
   <button class="close" onclick="closePanel()">Close</button>`;
}
function showMessage(){
 panel.classList.remove("hidden");
 panel.innerHTML=`
   <div class="message">
   <h3>💌 Happy Birthday!</h3>
   <p>Hi! I just wanted to make something a little different for your birthday.</p>
   Happy birthdayy teh, simple lang tong regalo ko sayo and website ulit HAHAHHA
    sorry ito lang kinaya ko now and sana maging masaya yung araw mo ngayon and 
    sana matupad lahat ng mga gusto at pangarap mo. Enjoy ka lang today teh,
     deserve mong mag enjoy HAHAHA. Ingat palagi and stay the same lang. Happy birthday ulit!
</b></p>
   </div>
   <button class="close" onclick="closePanel()">Close</button>`;
}
function showSurprise(){
 panel.classList.remove("hidden");
 panel.innerHTML=`
   <div style="font-size:75px">🎁</div>
   <h3>Surprise! ✨</h3>
   <p class="message">You made it all the way here HAHAHA. Here's another little birthday greeting just for you. 🐱💙</p>
   <button class="close" onclick="closePanel()">Close</button>`;
}
function showFinal(){
 document.getElementById("menu").classList.add("hidden");
 document.getElementById("final").classList.remove("hidden");
 for(let i=0;i<28;i++){
   const c=document.createElement("div"); c.className="confetti";
   c.textContent=["✦","✧","🎈","💙","🐾"][i%5];
   c.style.left=Math.random()*100+"vw";
   c.style.animationDelay=(Math.random()*3)+"s";
   document.body.appendChild(c);
 }
}
function closePanel(){panel.classList.add("hidden");panel.innerHTML="";}
</script>
</body>
</html>
